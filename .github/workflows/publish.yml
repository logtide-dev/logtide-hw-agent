name: Publish image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          AGENT=$(python3 -c "import re;print(re.search(r'AGENT_VERSION = \"([^\"]+)\"', open('logtide_hw_agent.py').read()).group(1))")
          if [ "$AGENT" != "$VERSION" ]; then
            echo "Tag $VERSION does not match AGENT_VERSION $AGENT" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          V="${{ steps.version.outputs.version }}"
          T="logtide/hw-agent:${V},ghcr.io/${{ github.repository_owner }}/logtide-hw-agent:${V}"
          if [ "${{ steps.version.outputs.stable }}" = "true" ]; then
            MAJOR="${V%%.*}"
            for t in "${MAJOR}" latest; do
              T="${T},logtide/hw-agent:${t},ghcr.io/${{ github.repository_owner }}/logtide-hw-agent:${t}"
            done
          fi
          echo "tags=${T}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
