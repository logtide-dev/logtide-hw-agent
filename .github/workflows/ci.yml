name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Official Python images: setup-python has no 3.8 build for current runners.
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: logtide/hw-agent:ci
      - name: Smoke test
        run: |
          docker run --rm logtide/hw-agent:ci --version
          docker run --rm --entrypoint smartctl logtide/hw-agent:ci --version | head -1
